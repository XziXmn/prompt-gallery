<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画廊 · 提示词画廊</title>
  <link rel="stylesheet" href="assets/css/style.css?v=14">
</head>
<body data-page="gallery">
  <header class="site-header">
    <div class="container inner">
      <a class="logo" href="index.html">提示词画廊</a>
      <nav class="nav">
        <a href="index.html" data-nav="home">首页</a>
        <a href="gallery.html" data-nav="gallery">画廊</a>
        <a href="favorites.html" data-nav="favorites">收藏</a>
        <a href="about.html" data-nav="about">关于</a>
      </nav>
      <div class="header-right">
        <button class="icon-btn" id="themeToggle" title="切换明暗主题" aria-label="切换明暗主题"></button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="filter-wrap">
      <div class="glass">
        <div class="filter-row" id="catChips"><span class="lbl">分类</span></div>
        <div class="filter-row" id="subChips" style="display:none"><span class="lbl">细分</span></div>
      </div>
    </div>

    <div class="toolbar">
      <input id="searchInput" class="search-input" type="search"
        placeholder="搜索标题 / 提示词全文(支持中英文)">
      <div class="segmented" id="sortSegmented">
        <button data-sort="hot" class="on">最热</button>
        <button data-sort="new">最新</button>
        <button data-sort="rand">随机</button>
      </div>
      <label class="switch-row">
        <input type="checkbox" id="refToggle"><span class="sw"></span>
        仅看需参考图
      </label>
    </div>

    <div class="result-info" id="resultInfo">加载中…</div>
    <div class="waterfall" id="grid"></div>
    <div class="load-more-wrap">
      <button class="btn secondary" id="loadMore" style="display:none">显示更多</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container inner">
      <span>提示词内容来自公开分享,仅供学习交流 · <a href="about.html">来源与说明</a></span>
    </div>
  </footer>

  <script src="settings.js?v=14"></script>
  <script src="settings.local.js?v=14"></script>
  <script src="assets/js/data-loader.js?v=14"></script>
  <script src="assets/js/app.js?v=14"></script>
</body>
</html>
