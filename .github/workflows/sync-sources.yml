name: Sync Sources(定时采集聚合)

on:
  schedule:
    - cron: "23 */6 * * *"   # 每 6 小时;X 热门上游每小时更新,这里追赶即可
  workflow_dispatch: {}        # 支持手动触发

permissions:
  contents: write

concurrency:
  group: sync-sources
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pipeline(采集→收编→归一→切片→校验)
        run: python scripts/pipeline.py

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化,跳过提交"
          else
            git commit -m "chore(data): 定时同步 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
