# 提示词画廊 · 服务器 nginx 配置
# 静态站点 + 图片缓存代理(/img?u=<原图URL>,域名白名单防开放代理滥用)

worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_comp_level 5;
  gzip_types application/json text/css application/javascript image/svg+xml text/plain;

  # 图片磁盘缓存:30 天,上限 3GB(超出自动淘汰最久未用)
  proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=img_cache:50m
                   max_size=3g inactive=30d use_temp_path=off;

  # 图片代理限流:单 IP 30 req/s,突发 60
  limit_req_zone $binary_remote_addr zone=img_rl:10m rate=30r/s;

  # ---- 图片域名白名单(防 SSRF;新图源出现时在此追加一行) ----
  map $arg_u $img_target {
    ~*^https://r2\.qqsrc\.com/               $arg_u;
    ~*^https://cms-assets\.youmind\.com/     $arg_u;
    ~*^https://raw\.githubusercontent\.com/  $arg_u;
    ~*^https://davidwuw0811-boop\.github\.io/ $arg_u;
    ~*^https://pbs\.twimg\.com/              $arg_u;
    ~*^https://upload\.maynor1024\.live/     $arg_u;
    default "";
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 站点静态文件
    location / {
      try_files $uri $uri/ =404;
    }

    # JSON 数据不缓存,git pull 更新后立即生效
    location ~* ^/data/.+\.json$ {
      add_header Cache-Control "no-cache";
    }

    # 图片缓存代理
    location = /img {
      if ($img_target = "") { return 403; }

      resolver 1.1.1.1 8.8.8.8 ipv6=off;
      proxy_pass $img_target;

      # 抹掉来源页 Referer,规避常见防盗链
      proxy_set_header Referer "";
      proxy_set_header User-Agent "Mozilla/5.0 (compatible; gallery-img-proxy/1.0)";
      proxy_connect_timeout 10s;
      proxy_read_timeout 30s;

      proxy_cache img_cache;
      proxy_cache_key $img_target;
      proxy_cache_valid 200 30d;
      proxy_cache_valid 404 10m;
      proxy_cache_lock on;

      add_header X-Cache $upstream_cache_status;
      add_header Cache-Control "public, max-age=2592000";

      limit_req zone=img_rl burst=60 nodelay;
    }
  }
}
